<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Money Meter" />
  <meta name="robots" content="noindex" />
  <title>Money Meter</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="title">🎮 Money Meter</div>
    <div class="right">
      <span id="updated"></span>
      <button id="refresh" title="Refresh" aria-label="Refresh">⟳</button>
      <button id="settings" title="Settings" aria-label="Settings">⚙️</button>
    </div>
  </header>
  <main id="main"><div class="loading">Loading…</div></main>
  <button id="addBtn" class="fab" aria-label="Add playtime or a payment" hidden>＋</button>
  <div id="shade"></div>
  <div id="sheet" role="dialog" aria-modal="true"></div>
  <div id="toast" role="status"></div>
  <noscript>This app needs JavaScript.</noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
